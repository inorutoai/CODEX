name: inoruto-security
services:
  db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run local-db.sh}
    volumes:
      - security-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.186.0@sha256:f2112b9289422f205df4ea15b8b550d425ae42528ea54521faa32cc7b62490de
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_DB_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3000/auth/callback
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
  rest:
    image: postgrest/postgrest:v14.3@sha256:7c5840727ad683b0fdbfb9810930665b34f8b44884a4dc740aa8844748a2b85e
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
      PGRST_DB_MAX_ROWS: 1000
  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    depends_on: [auth, rest]
    ports:
      - "127.0.0.1:54321:80"
    entrypoint: [/bin/sh, -c]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          client_max_body_size 1m;
          proxy_hide_header Access-Control-Allow-Origin;
          add_header Access-Control-Allow-Origin "http://127.0.0.1:3000" always;
          add_header Vary Origin always;
          add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept-profile, content-profile, prefer, range, range-unit, x-retry-count" always;
          add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
          if ($$request_method = OPTIONS) { return 204; }
          location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $$host; }
          location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $$host; }
          location / { return 404; }
        }
        CONF
        exec nginx -g 'daemon off;'
volumes:
  security-db:
